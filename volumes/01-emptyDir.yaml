apiVersion: v1
kind: pod
metadata:
  name: empty-dir-Deployment
  namespace: default
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - mountpath: /var/log/nginx
      name: nginx-logs
  container:
  - name: almalinux
    image: almalinux:9
    command: ["sleep","1000"]
    volumeMounts:
    - mountpath: /mnt/log/nginx
      name: nginx-logs
      readOnly: true

  volumes:
  - name: nginx-logs
    emptyDir:
      sigeLimit: 100Mi