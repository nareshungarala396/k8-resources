apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: ebs-dynamic
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: roboshop-ebs
  resources:
    requests:
      storage: 4Gi

---
apiVersion: v1
kind: pod
metadata:
  name: nginx
  labels:
    purpose: ebs-dynamic
spec:
  containers: 
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
      # nodeSelector:
      #  topology.kubernetes.io/zone: us-east-1b
  volumes:
    - name: nginx-html
      persistentVolumeClaim: 
        ClaimName: ebs-dynamic
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ebs-LoadBalancer
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-dynamic
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 3007