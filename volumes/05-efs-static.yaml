apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: efs-static
  labels:
    purpose: efs-static
spec:
  storage:
    capacity: 4Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver:
    volumeHandle:

apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: efs-static
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 4Gi

---
apiVersion: v1
kind: pod
metadata:
  name: nginx
  labels:
    purpose: ebs-static
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html
  nodeSelector:
  
  volumes:
  - name: nginx-html
    persistentVolumeClaim: 
      claimName: ebs-static