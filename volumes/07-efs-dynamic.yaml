apiVersion: v1
kind: persistentVolumeClaim
metadata: 
  name: efs-dynamic
spec:
  accessModes: 
  - ReadWritemany
  storageClassName: roboshop-dynamic
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: pod
metadata:
  name: nginx
  labels:
    purpose: efs-dynamic
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/user/html
  volumes:
  - name: nginx-html
    persistentVolumeClaim:
      claimName: efs-dynamic